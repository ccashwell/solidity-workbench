name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/extension/package.json').version")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "pkg=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG} does not match packages/extension version ${PKG_VERSION}"
            exit 1
          fi

      - name: Build
        run: pnpm -r build

      - name: Package VSIX
        run: cd packages/extension && pnpm package

      - name: Verify VSIX contents
        run: |
          VERSION=$(node -p "require('./packages/extension/package.json').version")
          VSIX="packages/extension/solidity-workbench-${VERSION}.vsix"
          test -f "$VSIX" || {
            echo "::error::Expected VSIX was not produced: $VSIX"
            exit 1
          }
          unzip -l "$VSIX" | tee /tmp/vsix-listing.txt
          grep -q 'extension/dist/server.js' /tmp/vsix-listing.txt
          grep -q 'extension/dist/extension.js' /tmp/vsix-listing.txt
          grep -q 'extension/resources/icon.png' /tmp/vsix-listing.txt
          grep -q 'extension/README.md' /tmp/vsix-listing.txt
          grep -q 'extension/LICENSE' /tmp/vsix-listing.txt
          grep -q 'extension/CHANGELOG.md' /tmp/vsix-listing.txt
          if grep -q 'extension/dist/test/' /tmp/vsix-listing.txt; then
            echo "::error::VSIX contains dist/test/ artifacts — check .vscodeignore"
            exit 1
          fi
          EXTRA_DIST_JS=$(awk '{print $4}' /tmp/vsix-listing.txt \
            | grep -E '^extension/dist/.*\.js$' \
            | grep -Ev '^extension/dist/(extension|server|parser-worker)\.js$' || true)
          if [ -n "$EXTRA_DIST_JS" ]; then
            echo "::error::VSIX contains unexpected dist JavaScript artifacts:"
            echo "$EXTRA_DIST_JS"
            exit 1
          fi

      - name: Publish to Open VSX
        env:
          # Repo secret is OVSX_TOKEN; OVSX_PAT kept as a backwards-compatible alias.
          OVSX_PAT: ${{ secrets.OVSX_TOKEN || secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OVSX_TOKEN (or legacy OVSX_PAT) is required to publish releases"
            exit 1
          fi
          VSIX=$(ls packages/extension/*.vsix | head -n 1)
          npx --yes ovsx publish "$VSIX" --pat "$OVSX_PAT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/extension/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
