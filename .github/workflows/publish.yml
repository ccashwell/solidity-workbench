name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/extension/package.json').version")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "pkg=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG} does not match packages/extension version ${PKG_VERSION}"
            exit 1
          fi

      - name: Build
        run: pnpm -r build

      - name: Package VSIX
        run: cd packages/extension && pnpm package

      - name: Verify VSIX contents
        run: pnpm verify:vsix

      - name: Publish to Open VSX
        env:
          # Repo secret is OVSX_TOKEN; OVSX_PAT kept as a backwards-compatible alias.
          OVSX_PAT: ${{ secrets.OVSX_TOKEN || secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OVSX_TOKEN (or legacy OVSX_PAT) is required to publish releases"
            exit 1
          fi
          VSIX="packages/extension/solidity-workbench-${{ steps.version.outputs.pkg }}.vsix"
          test -f "$VSIX" || {
            echo "::error::Expected VSIX was not produced: $VSIX"
            exit 1
          }
          npx --yes ovsx publish "$VSIX" --pat "$OVSX_PAT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/extension/solidity-workbench-${{ steps.version.outputs.pkg }}.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
