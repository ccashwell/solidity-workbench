name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild icon and check for drift
        run: |
          pnpm build:icon
          if ! git diff --quiet packages/extension/resources/icon.png; then
            echo "::error::icon.png is out of date — run 'pnpm build:icon' and commit the result"
            exit 1
          fi

      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm -r test

  e2e:
    name: Extension E2E (VSCode)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # `@vscode/test-electron` needs a display to launch VSCode;
      # xvfb-run provides a virtual one on GitHub's Linux runners.
      - name: Run extension E2E tests
        run: xvfb-run -a pnpm --filter solidity-workbench test:e2e
        env:
          CI: "true"

  package:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./packages/extension/package.json').version")
          echo "pkg=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm -r build

      - name: Package VSIX
        run: cd packages/extension && pnpm package

      - name: Verify VSIX contents
        run: pnpm verify:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: solidity-workbench-vsix
          path: packages/extension/solidity-workbench-${{ steps.version.outputs.pkg }}.vsix
