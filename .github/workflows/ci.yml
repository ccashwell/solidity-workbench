name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild icon and check for drift
        run: |
          pnpm build:icon
          if ! git diff --quiet packages/extension/resources/icon.png; then
            echo "::error::icon.png is out of date — run 'pnpm build:icon' and commit the result"
            exit 1
          fi

      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm -r test

  e2e:
    name: Extension E2E (VSCode)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # `@vscode/test-electron` needs a display to launch VSCode;
      # xvfb-run provides a virtual one on GitHub's Linux runners.
      - name: Run extension E2E tests
        run: xvfb-run -a pnpm --filter solidity-workbench test:e2e
        env:
          CI: "true"

  package:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./packages/extension/package.json').version")
          echo "pkg=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm -r build

      - name: Package VSIX
        run: cd packages/extension && pnpm package

      - name: Verify VSIX contents
        run: |
          VERSION="${{ steps.version.outputs.pkg }}"
          VSIX="packages/extension/solidity-workbench-${VERSION}.vsix"
          echo "Inspecting $VSIX"
          test -f "$VSIX" || {
            echo "::error::Expected VSIX was not produced: $VSIX"
            exit 1
          }
          unzip -l "$VSIX" | tee /tmp/vsix-listing.txt
          grep -q 'extension/dist/server.js' /tmp/vsix-listing.txt || {
            echo "::error::VSIX is missing bundled LSP server (extension/dist/server.js)"
            exit 1
          }
          grep -q 'extension/dist/extension.js' /tmp/vsix-listing.txt || {
            echo "::error::VSIX is missing bundled extension entry (extension/dist/extension.js)"
            exit 1
          }
          grep -q 'extension/resources/icon.png' /tmp/vsix-listing.txt || {
            echo "::error::VSIX is missing extension icon (extension/resources/icon.png)"
            exit 1
          }
          grep -q 'extension/README.md' /tmp/vsix-listing.txt || {
            echo "::error::VSIX is missing README.md (Marketplace overview tab will be empty)"
            exit 1
          }
          grep -q 'extension/LICENSE' /tmp/vsix-listing.txt || {
            echo "::error::VSIX is missing LICENSE"
            exit 1
          }
          grep -q 'extension/CHANGELOG.md' /tmp/vsix-listing.txt || {
            echo "::error::VSIX is missing CHANGELOG.md"
            exit 1
          }
          if grep -q 'extension/dist/test/' /tmp/vsix-listing.txt; then
            echo "::error::VSIX contains dist/test/ artifacts — check .vscodeignore"
            exit 1
          fi
          EXTRA_DIST_JS=$(awk '{print $4}' /tmp/vsix-listing.txt \
            | grep -E '^extension/dist/.*\.js$' \
            | grep -Ev '^extension/dist/(extension|server|parser-worker)\.js$' || true)
          if [ -n "$EXTRA_DIST_JS" ]; then
            echo "::error::VSIX contains unexpected dist JavaScript artifacts:"
            echo "$EXTRA_DIST_JS"
            exit 1
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: solidity-workbench-vsix
          path: packages/extension/solidity-workbench-${{ steps.version.outputs.pkg }}.vsix
